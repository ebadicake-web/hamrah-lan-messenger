name: Build Hamrah

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter platform scaffolding
        run: flutter create --project-name hamrah_lan_messenger --platforms=android,windows build_app
      - name: Copy application source
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -R lib build_app/lib
      - name: Resolve packages
        working-directory: build_app
        run: flutter pub get
      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hamrah-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter platform scaffolding
        run: flutter create --project-name hamrah_lan_messenger --platforms=android,windows build_app
      - name: Copy application source
        shell: pwsh
        run: |
          Copy-Item pubspec.yaml build_app/pubspec.yaml -Force
          Remove-Item build_app/lib -Recurse -Force
          Copy-Item lib build_app/lib -Recurse
      - name: Resolve packages
        working-directory: build_app
        run: flutter pub get
      - name: Build release Windows app
        working-directory: build_app
        run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build_app/build/windows/x64/runner/Release/* -DestinationPath hamrah-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hamrah-windows-zip
          path: hamrah-windows.zip
          if-no-files-found: error
